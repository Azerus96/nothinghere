name: Unzip Code
on: [push]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Unzip and commit
        run: |
          unzip -o mystyro.zip
          rm mystyro.zip
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Распаковал код"
          git push
